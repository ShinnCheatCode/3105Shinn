# Workflow build IPA không ký cho 3105Shinn trên GitHub Actions.
# Chạy trên macOS runner, tự chọn Xcode mới nhất, xuất artifact.
name: Build 3105Shinn IPA

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Runner macOS bắt buộc cho Xcode và SwiftUI.
    runs-on: macos-14

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Liệt kê Xcode khả dụng
        # In danh sách Xcode để kiểm tra.
        run: ls /Applications | grep -i Xcode || true

      - name: Chọn Xcode mới nhất
        # Tự chọn Xcode, không hardcode tên thư mục.
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Chọn: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Hiển thị phiên bản
        # In phiên bản Xcode và Swift.
        run: |
          xcodebuild -version
          swift --version

      - name: Build cho Simulator
        # Build scheme 3105 trên iOS Simulator, không ký.
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build cho thiết bị (không ký)
        # Build cho thiết bị thật, bỏ qua ký để lấy IPA không ký.
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Đóng gói IPA không ký
        # Tạo Payload và nén thành IPA.
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/3105.app build/Payload/
          cd build && zip -r 3105-unsigned.ipa Payload

      - name: Tải lên artifact
        # Đăng artifact để tải về từ tab Actions.
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/3105-unsigned.ipa
          retention-days: 14