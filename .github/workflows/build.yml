# Workflow build giao diện 3105 trên GitHub Actions.
# Chạy trên macOS runner, build scheme 3105, xuất artifact.
name: Build 3105 UI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Runner macOS bắt buộc cho Xcode và SwiftUI.
    runs-on: macos-14

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chọn Xcode
        # Chọn Xcode 16 để đảm bảo hỗ trợ Swift 5.10+.
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Hiển thị phiên bản
        # In phiên bản Xcode và Swift để kiểm tra.
        run: |
          xcodebuild -version
          swift --version

      - name: Build cho Simulator
        # Build scheme 3105 trên iOS Simulator, không ký.
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build cho thiết bị (không ký)
        # Build cho thiết bị thật nhưng bỏ qua ký để lấy IPA không ký.
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Đóng gói IPA không ký
        # Tạo thư mục Payload và nén thành IPA không ký.
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/3105.app build/Payload/
          cd build && zip -r 3105-unsigned.ipa Payload

      - name: Tải lên artifact
        # Đăng artifact để tải về từ tab Actions.
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/3105-unsigned.ipa
          retention-days: 14